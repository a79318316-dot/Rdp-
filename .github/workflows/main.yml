name: Remote Shell (Ubuntu + SSH + ngrok)

# Bu workflow SuperNinja için Ubuntu makinede SSH tüneli açar.
# Ubuntu-latest PUBLIC repo'da: 4 CPU / 16 GB RAM / 14 GB SSD
# 6 saatlik job limitini sleep ile doldururuz.
#
# Kullanım:
#   1. Repo PUBLIC olsun (16 GB RAM için)
#   2. NGROK_AUTHTOKEN secret'ı eklensin
#   3. Actions → "Remote Shell (Ubuntu + SSH + ngrok)" → Run workflow
#   4. Loglarda "SSH READY: tcp://..." satırını bekle
#   5. O adresi SuperNinja'ya ver

on:
  workflow_dispatch:
    inputs:
      keep_alive_minutes:
        description: 'Oturum süresi (dakika). Max 360.'
        required: false
        default: '360'
      setup_profile:
        description: 'Hangi araç seti kurulsun? (data|ml|web|minimal)'
        required: false
        default: 'data'

jobs:
  remote-shell:
    # PUBLIC repo = 16 GB RAM. Private = 8 GB. Public olmasını öneriyoruz.
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Show machine specs
        run: |
          echo "=== MAKİNE SPECLERİ ==="
          echo "CPU: $(nproc) çekirdek"
          echo "RAM: $(free -h | awk '/^Mem:/ {print $2}')"
          echo "Disk: $(df -h / | awk 'NR==2 {print $2}')"
          echo "OS: $(lsb_release -ds 2>/dev/null || cat /etc/os-release | grep PRETTY_NAME)"
          echo "======================"

      - name: Run setup script
        run: |
          chmod +x setup.sh
          ./setup.sh "${{ github.event.inputs.setup_profile }}"

      - name: Configure SSH server
        run: |
          # SSH host anahtarları
          sudo rm -f /etc/ssh/ssh_host_*
          sudo ssh-keygen -A

          # Şifresiz sudo olan runner kullanıcısı için SSH ayarı
          sudo sed -i 's/^#\?PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/^#\?PubkeyAuthentication.*/PubkeyAuthentication yes/' /etc/ssh/sshd_config

          # Servisi başlat
          sudo service ssh restart || sudo systemctl restart ssh || true
          echo "SSH servisi hazır"

      - name: Open ngrok SSH tunnel
        id: ngrok
        uses: tmshkr/ngrok-ssh@latest
        with:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
          NGROK_CONFIG_FILE: ngrok.yml
          WAIT_FOR_CONNECTION: 'true'
          TIMEOUT: ${{ github.event.inputs.keep_alive_minutes }}

      - name: Keep alive
        run: |
          echo "=== SSH READY — SuperNinja bağlanabilir ==="
          echo "Bağlantı bilgileri yukarıdaki ngrok adımının loglarında."
          echo "ngrok dashboard: https://dashboard.ngrok.cloud/cloud-edge/endpoints"
          echo "=========================================="
          KEEP=$(( ${{ github.event.inputs.keep_alive_minutes }} ))
          echo "Oturum ${KEEP} dakika açık kalacak..."
          sleep ${KEEP}m
